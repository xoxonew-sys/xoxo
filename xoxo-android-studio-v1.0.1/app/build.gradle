plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xoxo.gossipai'
    compileSdk 36

    defaultConfig {
        applicationId "com.xoxo.gossipai"

        // billing:1.2.0 (Google Play Faturalandirma) minimum 23 istiyor.
        // Android 5.x (API 21-22) payi ihmal edilebilir; bu cihazlar
        // mevcut surumde kalir, yeni guncellemeyi almaz.
        minSdk 23
        targetSdk 36

        // Play'deki son surum 7 (1.0.6). versionCode HER yuklemede
        // artmak zorunda, esit veya kucuk olursa Play reddeder.
        // 1.0.7: Google Play Faturalandirma (uygulama ici satin alma)
        versionCode 8
        versionName "1.0.7"
    }

    /*
     * Imza yapilandirmasi.
     *
     * Sifreler bu dosyada DEGIL, gradle.properties icinde duruyor ve
     * gradle.properties .gitignore'da. Sebep: build.gradle repoya
     * gidiyor; sifre buraya yazilirsa GitHub'a dusr.
     *
     * gradle.properties icerigi (proje kokunde, commit EDILMEZ):
     *   XOXO_STORE_FILE=C:\\Projelerim\\keys\\xoxo-upload.jks
     *   XOXO_STORE_PASSWORD=...
     *   XOXO_KEY_ALIAS=xoxo
     *   XOXO_KEY_PASSWORD=...
     *
     * Degiskenler tanimli degilse imzasiz derlenir; boylece baska bir
     * makinede proje en azindan acilir.
     */
    signingConfigs {
        release {
            if (project.hasProperty('XOXO_STORE_FILE')) {
                storeFile file(XOXO_STORE_FILE)
                storePassword XOXO_STORE_PASSWORD
                keyAlias XOXO_KEY_ALIAS
                keyPassword XOXO_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('XOXO_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    /*
     * 2.5.0 -> 2.6.2
     *
     * Play Console'daki "ucтan uca ekran" uyarilari Android 15'in
     * edge-to-edge zorunlulugundan geliyor. Yeni surum TWA kabugunda
     * bunu kendisi hallediyor; eski surumde sistem cubuklari altinda
     * icerik kaliyor.
     */
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'

    /*
     * Google Play Faturalandirma - TWA icinde uygulama ici satin alma.
     * Web tarafi Digital Goods API + Payment Request ile konusur
     * (client/src/lib/play-billing.ts). BILLING iznini de bu getirir;
     * Play Console bu izni tasiyan bir paket yuklenmeden urun
     * olusturmaya izin vermez.
     */
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
}
